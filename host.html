<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VVphone Host</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #111;
      color: #fff;
      font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow: hidden;
    }

    .host-root {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: row;
    }

    .host-left {
      flex: 0 0 420px;
      min-width: 340px;
      max-width: 460px;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(180deg, #1a1a1a 0%, #101010 100%);
      border-right: 1px solid rgba(255,255,255,.08);
      padding: 16px;
    }

    .host-phone-frame {
      width: min(100%, 390px);
      aspect-ratio: 390 / 844;
      max-height: calc(100vh - 32px);
      border-radius: 34px;
      overflow: hidden;
      box-shadow:
        0 24px 60px rgba(0,0,0,.5),
        inset 0 0 0 1px rgba(255,255,255,.05);
      background: #000;
      position: relative;
    }

    #vvphoneFrame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: transparent;
    }

    .host-right {
      flex: 1;
      min-width: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #181818;
    }

    .host-topbar {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid rgba(255,255,255,.08);
      background: #141414;
    }

    .host-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: .2px;
    }

    .host-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .host-btn {
      border: none;
      border-radius: 10px;
      background: #2a2a2a;
      color: #fff;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 13px;
    }

    .host-btn:hover {
      background: #353535;
    }

    .host-main {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      gap: 0;
    }

    .panel {
      min-width: 0;
      min-height: 0;
      border-right: 1px solid rgba(255,255,255,.06);
      display: flex;
      flex-direction: column;
    }

    .panel:last-child {
      border-right: none;
    }

    .panel-header {
      height: 48px;
      display: flex;
      align-items: center;
      padding: 0 14px;
      font-size: 14px;
      font-weight: 600;
      border-bottom: 1px solid rgba(255,255,255,.08);
      background: #161616;
    }

    .panel-body {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 12px;
    }

    .field-group {
      margin-bottom: 14px;
    }

    .field-label {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      color: #bdbdbd;
    }

    .field-input,
    .field-textarea,
    .field-select {
      width: 100%;
      border: 1px solid rgba(255,255,255,.12);
      background: #222;
      color: #fff;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
      outline: none;
    }

    .field-textarea {
      min-height: 110px;
      resize: vertical;
    }

    .row {
      display: flex;
      gap: 8px;
    }

    .row > * {
      flex: 1;
    }

    .small-note {
      font-size: 12px;
      color: #999;
      line-height: 1.5;
      margin-top: 6px;
    }

    .log-box {
      width: 100%;
      height: 100%;
      min-height: 220px;
      border: 1px solid rgba(255,255,255,.08);
      background: #101010;
      border-radius: 12px;
      padding: 10px;
      overflow: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      color: #d8d8d8;
    }

    .log-line {
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px dashed rgba(255,255,255,.06);
    }

    .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      margin-right: 6px;
      background: #2b2b2b;
      color: #fff;
    }

    .tag.ok { background: #1f7a4d; }
    .tag.warn { background: #8a6a18; }
    .tag.err { background: #8c2f39; }

    @media (max-width: 980px) {
      .host-root {
        flex-direction: column;
      }

      .host-left {
        flex: 0 0 auto;
        min-width: 0;
        max-width: none;
        border-right: none;
        border-bottom: 1px solid rgba(255,255,255,.08);
        padding: 12px;
      }

      .host-phone-frame {
        width: min(100%, 360px);
        max-height: min(78vh, 780px);
        border-radius: 30px;
      }

      .host-main {
        grid-template-columns: 1fr;
      }

      .panel {
        border-right: none;
        border-bottom: 1px solid rgba(255,255,255,.06);
      }

      .panel:last-child {
        border-bottom: none;
      }
    }
  </style>
</head>
<body>
  <div class="host-root">
    <div class="host-left">
      <div class="host-phone-frame">
        <iframe id="vvphoneFrame" src="./index.html"></iframe>
      </div>
    </div>

    <div class="host-right">
      <div class="host-topbar">
        <div class="host-title">VVphone 宿主页桥接面板</div>
        <div class="host-actions">
          <button class="host-btn" onclick="VVHostBridge.testIncomingCall()">测试来电</button>
          <button class="host-btn" onclick="VVHostBridge.clearLogs()">清空日志</button>
        </div>
      </div>

      <div class="host-main">
        <div class="panel">
          <div class="panel-header">桥接控制</div>
          <div class="panel-body">
            <div class="field-group">
              <label class="field-label">默认角色名</label>
              <input id="hostDefaultSender" class="field-input" type="text" value="角色" />
            </div>

            <div class="field-group">
              <label class="field-label">回复模式</label>
              <select id="hostReplyMode" class="field-select">
                <option value="mock">本地模拟回复</option>
                <option value="manual">手动输入回复</option>
                <option value="passthrough">仅记录slash，不主动回传</option>
              </select>
              <div class="small-note">
                mock：宿主页自动生成一条回复并回传给 VVphone。<br>
                manual：你手动输入内容后点按钮回传。<br>
                passthrough：只接收 VVphone 发来的 slash 命令，不主动回消息，方便你以后替换成真实 ST 执行器。
              </div>
            </div>

            <div class="field-group">
              <label class="field-label">手动回复内容</label>
              <textarea id="hostManualReply" class="field-textarea" placeholder="当模式为 manual 时，这里填写回传给 VVphone 的内容"></textarea>
            </div>

            <div class="row">
              <div class="field-group">
                <label class="field-label">电话状态测试</label>
                <select id="hostCallStatus" class="field-select">
                  <option value="accepted">accepted 接听</option>
                  <option value="rejected">rejected 拒接</option>
                  <option value="missed">missed 无人接听</option>
                </select>
              </div>
              <div class="field-group">
                <label class="field-label">手动回传类型</label>
                <select id="hostManualType" class="field-select">
                  <option value="chat">聊天回复</option>
                  <option value="call">电话回复</option>
                  <option value="feed">动态评论回复</option>
                </select>
              </div>
            </div>

            <div class="row">
              <button class="host-btn" onclick="VVHostBridge.sendManualReply()">发送手动回传</button>
              <button class="host-btn" onclick="VVHostBridge.sendManualCallStatus()">发送电话状态</button>
            </div>

            <div class="field-group" style="margin-top:14px;">
              <label class="field-label">说明</label>
              <div class="small-note">
                这份宿主页脚本默认先用“模拟桥接”跑通链路。<br>
                等你之后确认自己在 SillyTavern 里怎样调用 slash 命令、怎样拿回结果，再把 host-bridge.js 里对应函数替换成真实执行逻辑就行。
              </div>
            </div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header">桥接日志</div>
          <div class="panel-body">
            <div id="hostLogBox" class="log-box"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="./host-bridge.js"></script>
</body>
</html>
